---
- name: Manage pre-patch VM snapshots
  hosts: rhel_vms
  connection: local
  gather_facts: false
  tasks:
    - name: Create a pre-patch snapshot
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_host }}"
        username: "{{ vault_vcenter_user }}"
        password: "{{ vault_vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vm_folder }}"
        name: "{{ inventory_hostname }}"
        snapshot_name: "pre-patch-{{ patch_run_id }}"
        state: present
      when: snapshot_action == "create"

    - name: Revert to the pre-patch snapshot
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_host }}"
        username: "{{ vault_vcenter_user }}"
        password: "{{ vault_vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vm_folder }}"
        name: "{{ inventory_hostname }}"
        snapshot_name: "pre-patch-{{ patch_run_id }}"
        state: revert
      when: snapshot_action == "revert"

    - name: Delete the pre-patch snapshot
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_host }}"
        username: "{{ vault_vcenter_user }}"
        password: "{{ vault_vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vm_folder }}"
        name: "{{ inventory_hostname }}"
        snapshot_name: "pre-patch-{{ patch_run_id }}"
        state: absent
      when: snapshot_action == "delete"
