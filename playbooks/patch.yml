---
# Play 1: Generic servers (VMs + bare metal)
- name: Patch generic servers
  hosts: patch_targets
  become: true
  serial: "{{ patch_batch_size }}"
  max_fail_percentage: "{{ max_fail_percentage }}"

  tasks:
    - block:
        - name: Update installed packages
          dnf:
            name: "*"
            state: latest
            update_only: true

        - name: Check if reboot is needed
          command: needs-restarting -r
          register: reboot_check
          changed_when: false
          failed_when: false

        - name: Reboot if necessary
          reboot:
            reboot_timeout: 600
          when: reboot_check.rc == 1

      rescue:
        - name: Revert snapshot for this VM
          community.vmware.vmware_guest_snapshot:
            hostname: "{{ vcenter_host }}"
            username: "{{ vault_vcenter_user }}"
            password: "{{ vault_vcenter_password }}"
            validate_certs: false
            name: "{{ inventory_hostname }}"
            snapshot_name: "pre-patch-{{ patch_run_id }}"
            state: revert
          delegate_to: localhost
          when: inventory_hostname in groups['rhel_vms']

        - name: Re-raise failure to count toward threshold
          fail:
            msg: "{{ inventory_hostname }} failed – snapshot reverted"

# Play 2: Kubernetes control plane (serial 1, zero tolerance)
- name: Patch k8s control plane
  hosts: k8s_control_plane
  become: true
  serial: 1
  max_fail_percentage: 0

  tasks:
    - name: Cordon node
      command: kubectl cordon {{ inventory_hostname }}
      changed_when: false

    - name: Drain node
      command: kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
      register: drain_output
      until: drain_output.rc == 0
      retries: 3
      delay: 10

    - block:
        - name: Update packages
          dnf:
            name: "*"
            state: latest
            update_only: true

        - name: Check reboot
          command: needs-restarting -r
          register: reboot_check
          changed_when: false
          failed_when: false

        - name: Reboot if needed
          reboot:
            reboot_timeout: 600
          when: reboot_check.rc == 1

      rescue:
        - fail:
            msg: "Control plane node {{ inventory_hostname }} failed"

    - name: Uncordon node
      command: kubectl uncordon {{ inventory_hostname }}
      changed_when: false
      when: not (ansible_failed_result is defined and ansible_failed_result.failed)

# Play 3: Kubernetes workers (batch, 10% tolerance)
- name: Patch k8s workers
  hosts: k8s_workers
  become: true
  serial: "{{ patch_batch_size }}"
  max_fail_percentage: 10

  tasks:
    - name: Cordon node
      command: kubectl cordon {{ inventory_hostname }}
      changed_when: false

    - name: Drain node
      command: kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
      register: drain_output
      until: drain_output.rc == 0
      retries: 3
      delay: 10

    - block:
        - name: Update packages
          dnf:
            name: "*"
            state: latest
            update_only: true

        - name: Check reboot
          command: needs-restarting -r
          register: reboot_check
          changed_when: false
          failed_when: false

        - name: Reboot if needed
          reboot:
            reboot_timeout: 600
          when: reboot_check.rc == 1

      rescue:
        - fail:
            msg: "Worker node {{ inventory_hostname }} failed"

    - name: Uncordon node
      command: kubectl uncordon {{ inventory_hostname }}
      changed_when: false
      when: not (ansible_failed_result is defined and ansible_failed_result.failed)