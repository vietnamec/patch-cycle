---
- name: Grant SSH access for patching
  hosts: all
  become: true
  tasks:
    - name: Add the patch user's public key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', ssh_public_key_path) }}"
      when: ssh_public_key_path is defined
