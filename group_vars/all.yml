---
# Ansible runtime
ansible_user: "{{ vault_ansible_user }}"
ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
ansible_python_interpreter: /usr/bin/python3

# Patching behaviour
patch_batch_size: 5
max_fail_percentage: 10

# vCenter
vcenter_host: "{{ vault_vcenter_host }}"
vcenter_datacenter: "{{ vault_vcenter_datacenter }}"

# Monitoring
monitoring_api_url: "https://monitoring.example.com/api"
