name: Grant SSH access

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: 'Path to the public key file on the runner'
        required: true
        default: '/tmp/patch_key.pub'

jobs:
  grant:
    runs-on: [self-hosted, on-prem]
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-core
      - name: Run grant_ssh playbook
        run: |
          ansible-playbook playbooks/grant_ssh.yml -i inventory.yml \
            -e ssh_public_key_path=${{ github.event.inputs.ssh_public_key }}